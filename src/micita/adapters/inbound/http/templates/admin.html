{% extends "base.html" %}
{% block contenido %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-2xl font-semibold">Pacientes registrados</h1>
  <a href="/admin/exportar" class="bg-cyan-700 text-white rounded-lg px-4 py-2 text-sm">Exportar CSV</a>
</div>
<div class="bg-white rounded-xl shadow overflow-x-auto">
  <table class="w-full text-sm">
    <thead class="bg-slate-50 text-left">
      <tr><th class="p-3">ID</th><th class="p-3">Cédula</th><th class="p-3">Nombre</th><th class="p-3">Teléfono</th><th class="p-3">EPS</th><th class="p-3">Hash</th></tr>
    </thead>
    <tbody>
    {% for p in pacientes %}
      <tr class="border-t"><td class="p-3">{{ p.id }}</td><td class="p-3">{{ p.cedula }}</td><td class="p-3">{{ p.nombre }}</td><td class="p-3">{{ p.telefono }}</td><td class="p-3">{{ p.eps }}</td><td class="p-3 font-mono text-xs">{{ p.password_hash }}</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
