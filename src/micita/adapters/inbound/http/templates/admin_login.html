{% extends "base.html" %}
{% block contenido %}
<div class="max-w-sm mx-auto bg-white rounded-2xl shadow p-8">
  <h1 class="text-xl font-semibold mb-4">Administración</h1>
  <form method="post" class="space-y-3">
    <input name="usuario" placeholder="Usuario" class="w-full rounded-lg border border-slate-300 px-3 py-2">
    <input name="clave" type="password" placeholder="Clave" class="w-full rounded-lg border border-slate-300 px-3 py-2">
    <button class="w-full bg-slate-800 text-white rounded-lg py-2">Entrar</button>
  </form>
</div>
{% endblock %}
