<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiCita · Salud Caribe IPS</title>
  <!-- Tailwind en modo CDN para desarrollo; en producción se usa /static/css/app.css generado en frontend/ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="http://cdn.jsdelivr.net/npm/axios@0.21.1/dist/axios.min.js"></script>
  <script src="http://cdn.jsdelivr.net/npm/lodash@4.17.15/lodash.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <header class="bg-cyan-800 text-white">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="text-xl font-bold tracking-tight">MiCita <span class="font-normal text-cyan-200">· Salud Caribe IPS</span></a>
      <nav class="space-x-4 text-sm">
        <a href="/buscar" class="hover:underline">Buscar médico</a>
        <a href="/admin" class="hover:underline">Administración</a>
      </nav>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-6 py-8">
    {% block contenido %}{% endblock %}
  </main>
  <footer class="text-center text-xs text-slate-500 pb-6">Salud Caribe IPS · Barranquilla · Datos ficticios para uso académico</footer>
  <script src="/static/js/app.js"></script>
</body>
</html>
