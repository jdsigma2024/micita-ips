{% extends "base.html" %}
{% block contenido %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow p-8">
  <h1 class="text-2xl font-semibold mb-1">Ingreso de pacientes</h1>
  <p class="text-sm text-slate-500 mb-6">Consulte sus citas y resultados de laboratorio.</p>
  {% if error %}
  <div class="bg-red-50 text-red-700 border border-red-200 rounded-lg p-3 mb-4 text-sm">{{ error|safe }}</div>
  {% endif %}
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Cédula</label>
      <input name="cedula" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-600">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Contraseña <span class="text-slate-400">(su fecha de nacimiento AAAAMMDD)</span></label>
      <input name="password" type="password" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-600">
    </div>
    <button class="w-full bg-cyan-700 hover:bg-cyan-800 text-white font-medium rounded-lg py-2">Ingresar</button>
  </form>
  <form method="post" action="/recuperar" class="mt-6 border-t pt-4 flex gap-2 items-center text-sm">
    <span class="text-slate-500">¿Olvidó su contraseña?</span>
    <input name="cedula" placeholder="Cédula" class="flex-1 rounded-lg border border-slate-300 px-2 py-1">
    <button class="text-cyan-700 font-medium">Restablecer</button>
  </form>
</div>
{% endblock %}
